# HACtions: PHI scanning template
# Include this in your .gitlab-ci.yml to scan for content that looks like
# Protected Health Information (PHI).
#
# The scanner itself is Morrison-Lab/gha's check-phi.py, fetched at runtime from
# GitHub at a pinned commit SHA. HACtions does not reimplement it: the script is
# platform-agnostic (configured entirely through PHI_* environment variables,
# with no GitHub API or GITHUB_* coupling), so this template only has to map
# GitLab CI context onto that contract. See issue #65.
#
# Detectors (default): ssn, mrn, dob, csv_phi_header, study_id
# Also available:      phone, email
#
# Matched values are NEVER printed to the job log -- findings report
# file:line:col and a detector name only.
#
# Required stage:
#   secrets  (the same stage security.yml uses)
#
# Runner preconditions:
#   - Egress to raw.githubusercontent.com. The scanner is fetched from GitHub at
#     job time; without egress the job fails loudly (by design -- see below).
#   - A Debian/Ubuntu-based image, because before_script installs curl and git
#     with apt-get. An Alpine or distroless HAC_PHI_IMAGE needs those tools
#     baked in and the before_script overridden.
#
# Optional CI/CD Variables:
#   HAC_PHI_IMAGE           Image providing python3 (default: "python:3.13-slim").
#                           Must be Debian/Ubuntu-based unless before_script is
#                           overridden; see Runner preconditions above.
#   HAC_GHA_REPO            owner/repo hosting check-phi.py (default: "Morrison-Lab/gha").
#   HAC_GHA_REF             Commit SHA to fetch at. Pin to a SHA, never a branch:
#                           the fetched script is EXECUTED, so a moving ref means
#                           unreviewed code runs in your pipeline.
#   HAC_PHI_SHA256          Expected sha256 of check-phi.py. Verified before the
#                           script runs. Set to "" to skip verification (not
#                           recommended). MUST be updated whenever HAC_GHA_REF is.
#   HAC_PHI_DETECTORS       Comma-separated detector set, overriding the default.
#   HAC_PHI_PATHS_IGNORE    Comma/newline-separated globs to skip. Supports
#                           *, ?, and recursive ** (e.g. "tests/fixtures/**").
#   HAC_PHI_ALLOWLIST_FILE  Path to a file of regexes; a matching line is
#                           suppressed. When unset, .gitlab/phi-allowlist.txt is
#                           used if present, then .github/phi-allowlist.txt.
#   HAC_PHI_FAIL            "false" to warn instead of failing (default: "true").
#
# Suppressing a false positive:
#   - add a "phi-allow" comment on the offending line, or
#   - add a regex to the allowlist file.
#
# Scan scope:
#   On the default branch, the whole tracked tree is scanned. On any other
#   branch, only lines added relative to the default branch are scanned, so
#   pre-existing content does not re-report on every pipeline.
#
#   If the default branch cannot be fetched, the job widens to a whole-tree scan
#   and says so. That is the safe direction (it scans more, never less), but it
#   can surface pre-existing content a consumer expected to be out of scope. The
#   usual cause is a shallow clone, so GIT_DEPTH is pinned to 0 below.
#
# Known cosmetic wart:
#   check-phi.py emits findings as GitHub Actions annotations
#   ("::error file=...,line=...::"). GitLab does not render these, so they
#   appear as plain log lines. The file:line information is all present and
#   correct; only the rendering is lost. Tracked as a follow-up.

# These are TOP-LEVEL rather than job-level on purpose. GitLab gives job-level
# `variables:` precedence over the global block, so defining them on the job
# would silently override anything a consumer sets in their own `variables:`
# block -- which is exactly what the README tells them to do. Defined here, the
# consumer's own file wins.
variables:
  HAC_PHI_IMAGE: "python:3.13-slim"
  HAC_GHA_REPO: "Morrison-Lab/gha"
  # Pinned commit SHA of Morrison-Lab/gha. Bump deliberately, and update
  # HAC_PHI_SHA256 in the same change.
  HAC_GHA_REF: "9311cb1c2f92e197e05fe003e879343efcd7905d"
  # 64 hex characters, as a SHA-256 digest must be. Re-derive rather than
  # counting by eye:
  #   curl -sS "https://raw.githubusercontent.com/Morrison-Lab/gha/\
  #     9311cb1c2f92e197e05fe003e879343efcd7905d/check-phi/check-phi.py" \
  #     | sha256sum
  # tests/lib/check_phi_pin.bats asserts ^[0-9a-f]{64}$ on this value, so a
  # truncated digest fails CI rather than reaching a consumer.
  HAC_PHI_SHA256: "21db6ab41da5162262aabe9f869133fc63d83ea0945e7b84e6fe7591c3f00862"
  HAC_PHI_DETECTORS: ""
  HAC_PHI_PATHS_IGNORE: ""
  HAC_PHI_ALLOWLIST_FILE: ""
  HAC_PHI_FAIL: "true"

.hac-check-phi:
  stage: secrets
  image: "${HAC_PHI_IMAGE}"
  needs: []
  interruptible: true
  variables:
    # Not consumer-tunable, so these stay job-level. Diff mode needs the default
    # branch in history; a shallow clone makes the merge-base unreachable and
    # the scanner falls back to a whole-tree scan.
    #
    # GIT_STRATEGY and GIT_CHECKOUT are pinned for a sharper reason: forcing
    # full history does not force a working tree. A consumer setting
    # GIT_STRATEGY: none or GIT_CHECKOUT: "false" globally would leave the
    # scanner walking an absent or empty checkout and reporting no findings --
    # a green PHI scan that examined nothing. Matches .hac-claude-review.
    GIT_STRATEGY: clone
    GIT_CHECKOUT: "true"
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == "gh-pages"
      when: never
    # workflow.yml admits tag pipelines, where CI_COMMIT_BRANCH is unset. Without
    # this rule the job would silently never run on a tag -- including a hotfix
    # tag cut from a non-default branch, which no main-branch scan has covered.
    # There is no branch to diff against on a tag, so this is a whole-tree scan.
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  before_script:
    - |
      set -eu
      # curl fetches the scanner; git supplies ls-files and diff. Without git
      # the scanner falls back to walking the filesystem, which would scan
      # untracked and ignored files too.
      apt-get -o APT::Sandbox::User=root update -qq
      apt-get install -y -qq --no-install-recommends curl git ca-certificates
      # apt-get update exits 0 even when every index fails to download, so no
      # exit status above establishes that the tools arrived. Check directly.
      for tool in curl git; do
        command -v "$tool" >/dev/null 2>&1 || {
          echo "ERROR: $tool was not installed; cannot continue." >&2
          exit 1
        }
      done
  script:
    # Fetch the scanner. This MUST fail loudly: a PHI scan that silently does
    # not run leaves the pipeline green and reports nothing, which is worse
    # than having no scanner at all because it reads as a clean result.
    - |
      set -euo pipefail
      # Scratch lives OUTSIDE the checkout. Writing a fixed filename into the
      # working tree would overwrite a consumer file tracked at that path --
      # letting its real content evade a whole-tree scan -- and then delete it
      # on a reused shell-executor workspace.
      PHI_TMP="${TMPDIR:-/tmp}/hac-phi-${CI_JOB_ID:-$$}"
      mkdir -p "$PHI_TMP"
      PHI_SCRIPT_URL="https://raw.githubusercontent.com/${HAC_GHA_REPO}/${HAC_GHA_REF}/check-phi/check-phi.py"
      HTTP_CODE=$(curl -sS -w '%{http_code}' "$PHI_SCRIPT_URL" -o "$PHI_TMP/check-phi.py") || true
      HTTP_CODE="${HTTP_CODE:-000}"
      # curl can emit unexpected output on failure, so HTTP_CODE is not
      # guaranteed numeric. A case glob is portable; `expr STRING : REGEX`
      # anchors implicitly and handles a leading ^ inconsistently.
      case "$HTTP_CODE" in
        ''|*[!0-9]*) HTTP_CODE=000 ;;
      esac
      if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
        echo "ERROR: Failed to fetch check-phi.py (HTTP $HTTP_CODE)" >&2
        echo "  URL: $PHI_SCRIPT_URL" >&2
        echo "  Check HAC_GHA_REPO / HAC_GHA_REF, and that this runner has" >&2
        echo "  egress to raw.githubusercontent.com." >&2
        exit 1
      fi
      if [ ! -s "$PHI_TMP/check-phi.py" ]; then
        echo "ERROR: Fetched check-phi.py is empty" >&2
        exit 1
      fi
      # Guard against a proxy HTML page or a JSON error body being executed.
      if ! head -n 1 "$PHI_TMP/check-phi.py" | grep -q '^#!/usr/bin/env python3'; then
        echo "ERROR: Fetched check-phi.py does not look like a Python script." >&2
        echo "  First line: $(head -n 1 "$PHI_TMP/check-phi.py")" >&2
        exit 1
      fi
    # Verify the fetched script before executing it.
    - |
      set -euo pipefail
      if [ -n "${HAC_PHI_SHA256}" ]; then
        ACTUAL_SHA=$(sha256sum "$PHI_TMP/check-phi.py" | cut -d' ' -f1)
        if [ "$ACTUAL_SHA" != "$HAC_PHI_SHA256" ]; then
          echo "ERROR: check-phi.py checksum mismatch; refusing to execute." >&2
          echo "  expected: $HAC_PHI_SHA256" >&2
          echo "  actual:   $ACTUAL_SHA" >&2
          echo "  If HAC_GHA_REF was bumped, update HAC_PHI_SHA256 to match." >&2
          exit 1
        fi
        echo "check-phi.py checksum verified."
      else
        echo "WARNING: HAC_PHI_SHA256 is empty; executing check-phi.py unverified." >&2
      fi
    # Resolve the diff base. workflow.yml suppresses merge_request_event
    # pipelines, so CI_MERGE_REQUEST_DIFF_BASE_SHA is not set here -- these are
    # branch pipelines. Derive the base from the default branch instead; the
    # scanner uses a three-dot diff, so this is the merge base.
    - |
      set -euo pipefail
      # Scratch lives OUTSIDE the checkout. Writing a fixed filename into the
      # working tree would overwrite a consumer file tracked at that path --
      # letting its real content evade a whole-tree scan -- and then delete it
      # on a reused shell-executor workspace.
      PHI_TMP="${TMPDIR:-/tmp}/hac-phi-${CI_JOB_ID:-$$}"
      mkdir -p "$PHI_TMP"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        # A tag has no branch to diff against, and CI_COMMIT_BRANCH is empty on
        # tag pipelines -- so without this arm the equality test below fails and
        # the job would try to diff, contradicting the documented behaviour.
        echo "Tag pipeline (${CI_COMMIT_TAG}); scanning the whole tracked tree."
        PHI_BASE_REF=""
      elif [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ]; then
        echo "On the default branch; scanning the whole tracked tree."
        PHI_BASE_REF=""
      else
        # The refspec is explicit on purpose. `git fetch origin <branch>` only
        # updates refs/remotes/origin/<branch> opportunistically, when the
        # remote's configured fetch refspec already covers it -- and a GitLab
        # runner commonly clones just the pipeline branch, so it does not. The
        # commit would land in FETCH_HEAD alone, rev-parse below would fail, and
        # the job would silently widen to a whole-tree scan.
        # Tracked explicitly. A workspace that has been reused can still hold a
        # STALE refs/remotes/origin/<branch> from an earlier pipeline, and
        # rev-parse would accept it -- so a failed fetch would silently diff
        # against an outdated base rather than taking the whole-tree fallback
        # this template documents. Success of the fetch, not existence of the
        # ref, is what licenses diff mode.
        fetch_ok=1
        git fetch --quiet origin \
          "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}" || {
          fetch_ok=0
          echo "WARNING: could not fetch ${CI_DEFAULT_BRANCH}; scanning the whole tree." >&2
        }
        if [ "$fetch_ok" -eq 1 ] && git rev-parse --verify --quiet "origin/${CI_DEFAULT_BRANCH}" >/dev/null; then
          PHI_BASE_REF="origin/${CI_DEFAULT_BRANCH}"
          echo "Scanning lines added relative to ${PHI_BASE_REF}."
        else
          PHI_BASE_REF=""
          echo "WARNING: origin/${CI_DEFAULT_BRANCH} unavailable; scanning the whole tree." >&2
        fi
      fi
      # Raw value, not shell syntax: this file is read with `cat`, never sourced.
      printf '%s' "${PHI_BASE_REF}" > "$PHI_TMP/base-ref"
    # Pick the allowlist. Passing a path that does not exist makes the scanner
    # warn, so only set the variable when a file is actually there.
    - |
      set -euo pipefail
      # Scratch lives OUTSIDE the checkout. Writing a fixed filename into the
      # working tree would overwrite a consumer file tracked at that path --
      # letting its real content evade a whole-tree scan -- and then delete it
      # on a reused shell-executor workspace.
      PHI_TMP="${TMPDIR:-/tmp}/hac-phi-${CI_JOB_ID:-$$}"
      mkdir -p "$PHI_TMP"
      ALLOWLIST="${HAC_PHI_ALLOWLIST_FILE}"
      if [ -z "$ALLOWLIST" ]; then
        for candidate in .gitlab/phi-allowlist.txt .github/phi-allowlist.txt; do
          if [ -f "$candidate" ]; then
            ALLOWLIST="$candidate"
            break
          fi
        done
      fi
      printf '%s' "${ALLOWLIST}" > "$PHI_TMP/allowlist"
      if [ -n "$ALLOWLIST" ]; then
        echo "Using PHI allowlist: $ALLOWLIST"
      fi
    # Run the scan. -u keeps findings streaming to the live log rather than
    # appearing only at exit.
    - |
      set -euo pipefail
      # Scratch lives OUTSIDE the checkout. Writing a fixed filename into the
      # working tree would overwrite a consumer file tracked at that path --
      # letting its real content evade a whole-tree scan -- and then delete it
      # on a reused shell-executor workspace.
      PHI_TMP="${TMPDIR:-/tmp}/hac-phi-${CI_JOB_ID:-$$}"
      mkdir -p "$PHI_TMP"
      # Read back as data. The previous version sourced a KEY=VALUE file, which
      # made any path containing a space (or a shell metacharacter) get parsed
      # as code rather than used as a path.
      export PHI_BASE_REF="$(cat "$PHI_TMP/base-ref")"
      export PHI_ALLOWLIST_FILE="$(cat "$PHI_TMP/allowlist")"
      export PHI_DETECTORS="${HAC_PHI_DETECTORS}"
      export PHI_PATHS_IGNORE="${HAC_PHI_PATHS_IGNORE}"
      export PHI_FAIL="${HAC_PHI_FAIL}"
      # cwd stays the checkout, so the scanner still sees the repo.
      python3 -u "$PHI_TMP/check-phi.py"
  # The fetched scanner is executable Python pulled from GitHub, so it is
  # removed rather than left for a reused workspace. Nothing here touches the
  # checkout: the whole scratch directory is outside it.
  after_script:
    - rm -rf "${TMPDIR:-/tmp}/hac-phi-${CI_JOB_ID:-}"

check-phi:
  extends: .hac-check-phi
