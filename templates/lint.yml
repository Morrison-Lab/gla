# gla: Linting template
# Include this in your .gitlab-ci.yml to run lintr on your package.
#
# Produces a GitLab Code Quality report artifact.
#
# Optional variables:
#   LINTR_ERROR_ON_LINT: "true" to fail on lint findings (default: "true")
#   GLA_REF:    Branch/tag/SHA of gla to fetch the lint script
#                        from (default: "main"). Pin to a tag or SHA for
#                        reproducible builds — "main" tracks latest.
#   GLA_PROJECT_ID: Project ID of the gla repo (default set below).
#   GLA_GLR_PROJECT_ID:    Project ID of the glr package repo (default set below).
#   GLA_GLR_PROJECT_PATH:  Git path of the glr package repo
#                           (default: "example-group/glr").
#   GLA_GLR_REF:           Branch/tag/SHA of glr to install (default: "main").
#   GLA_GLR_FETCH_METHOD:  "git" (default) or "archive". Git transport supports
#                           branch/tag refs and avoids instance-specific archive
#                           API restrictions. Use archive for commit-SHA pins.
#                           Pin to a tag or SHA for reproducible builds.
#
# Security / Reproducibility:
#   This template fetches and executes scripts/lint-codequality.R from gla
#   and installs the glr package at runtime. The default `main` refs are moving
#   targets — consumers implicitly trust gla/glr maintainers and accept that
#   linting behavior may change between runs. For reproducible builds, **pin both
#   GLA_REF and GLA_GLR_REF to a tag or commit SHA**. This is the
#   recommended configuration for production/release pipelines.
#
# The lint + Code Quality logic lives in scripts/lint-codequality.R (versioned,
# lintable, testable). This template fetches it at runtime from gla.

.gla-linting:
  stage: lint
  variables:
    GLA_DEP_MANAGER: "pak"
    LINTR_ERROR_ON_LINT: "true"
    # GLA_R_LIBS_USER is used in cache paths below. R_LIBS_USER is the variable
    # R actually reads. Both MUST stay identical — if one changes, update the other.
    GLA_R_LIBS_USER: "${CI_PROJECT_DIR}/ci/lib"
    # R_LIBS_USER ensures R subprocesses find packages in the cached location.
    # Set directly (not via GLA_R_LIBS_USER) — GitLab intra-block expansion is unreliable.
    R_LIBS_USER: "${CI_PROJECT_DIR}/ci/lib"
    # gla project coordinates for script fetching
    GLA_PROJECT_ID: "2058"
    GLA_REF: "main"
    # glr package project ID and ref (example-group/glr)
    GLA_GLR_PROJECT_ID: "2071"
    GLA_GLR_PROJECT_PATH: "example-group/glr"
    GLA_GLR_REF: "main"
    GLA_GLR_FETCH_METHOD: "git"
  except:
    - gh-pages
  script:
    - mkdir -p "$R_LIBS_USER"
    # Install dependencies (lintr + helpers + the package itself)
    - |
      if [[ "$GLA_DEP_MANAGER" == "renv" ]]; then
        Rscript -e '
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          source("renv/activate.R")
          renv::restore()
          # NOTE: keep this list in sync with the pak branch below
          renv::install(c("lintr", "jsonlite", "digest", "pkgload"), upgrade = FALSE)
          renv::install(".", upgrade = FALSE, dependencies = TRUE)
        '
      else
        Rscript -e '
          if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")
          # NOTE: keep this list in sync with the renv branch above
          pak::pkg_install(c("lintr", "jsonlite", "digest", "pkgload"), upgrade = FALSE)
          pak::pak(pkg = ".", upgrade = FALSE, dependencies = TRUE)
        '
      fi
    # Install the glr helper package (provides glr::lint_to_codequality).
    # glr lives in its own repo: example-group/glr
    # This block is dep-manager-agnostic by design: regardless of whether the
    # consumer uses pak or renv above, glr is always installed from a local source
    # checkout + pak::local_install (which resolves glr's declared Imports).
    # Git transport is the default because it works when an instance restricts the
    # otherwise-supported repository archive API for cross-project job tokens.
    # It supports named branch/tag refs; set GLA_GLR_FETCH_METHOD=archive for
    # commit-SHA pins or the legacy archive-download behavior.
    # Skip if glr is already installed (e.g. when linting the glr package itself).
    - |
      set -euo pipefail
      if Rscript -e 'if (requireNamespace("glr", quietly = TRUE)) quit(status = 0) else quit(status = 1)'; then
        echo "glr already installed — skipping source fetch."
      else
      trap 'rm -rf .gla-tmp' EXIT
      mkdir -p .gla-tmp
      case "$GLA_GLR_FETCH_METHOD" in
        git)
          # Disable tracing before examining credential-bearing variables.
          set +x
          unset GLR_GIT_USERNAME GLR_GIT_PASSWORD GIT_ASKPASS GIT_TERMINAL_PROMPT
          if [[ -n "${CI_JOB_TOKEN:-}" ]]; then
            GLR_GIT_USERNAME=gitlab-ci-token
            GLR_GIT_PASSWORD=$CI_JOB_TOKEN
          elif [[ -n "${GITLAB_TOKEN:-}" ]]; then
            GLR_GIT_USERNAME=oauth2
            GLR_GIT_PASSWORD=$GITLAB_TOKEN
          else
            echo "ERROR: GLA_GLR_FETCH_METHOD=git requires GITLAB_TOKEN or CI_JOB_TOKEN" >&2
            exit 1
          fi
          command -v git >/dev/null || {
            echo "ERROR: git is required for GLA_GLR_FETCH_METHOD=git" >&2
            exit 1
          }
          # Keep the job token out of the remote URL and command arguments.
          umask 077
          GLR_ASKPASS=$(mktemp)
          trap 'rm -f "$GLR_ASKPASS"; rm -rf .gla-tmp' EXIT
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "$GLR_GIT_USERNAME" ;;' \
            '  *Password*) printf "%s\\n" "$GLR_GIT_PASSWORD" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$GLR_ASKPASS"
          chmod 700 "$GLR_ASKPASS"
          GLR_REPO_URL="${CI_SERVER_URL}/${GLA_GLR_PROJECT_PATH}.git"
          LC_ALL=C GIT_ASKPASS="$GLR_ASKPASS" GIT_TERMINAL_PROMPT=0 \
            GLR_GIT_USERNAME="$GLR_GIT_USERNAME" GLR_GIT_PASSWORD="$GLR_GIT_PASSWORD" \
            git clone --depth 1 --no-checkout "$GLR_REPO_URL" .gla-tmp/glr
          if [[ "$GLA_GLR_REF" =~ ^[0-9a-fA-F]{7,40}$ ]] && ! \
            LC_ALL=C GIT_ASKPASS="$GLR_ASKPASS" GIT_TERMINAL_PROMPT=0 \
              GLR_GIT_USERNAME="$GLR_GIT_USERNAME" GLR_GIT_PASSWORD="$GLR_GIT_PASSWORD" \
              git -C .gla-tmp/glr ls-remote --exit-code origin \
              "refs/heads/${GLA_GLR_REF}" "refs/tags/${GLA_GLR_REF}" >/dev/null; then
            echo "ERROR: Git transport cannot reliably fetch a bare commit SHA." >&2
            echo "  Set GLA_GLR_FETCH_METHOD=archive for commit-SHA pins," >&2
            echo "  or use a named branch/tag with GLA_GLR_FETCH_METHOD=git." >&2
            exit 1
          fi
          LC_ALL=C GIT_ASKPASS="$GLR_ASKPASS" GIT_TERMINAL_PROMPT=0 \
            GLR_GIT_USERNAME="$GLR_GIT_USERNAME" GLR_GIT_PASSWORD="$GLR_GIT_PASSWORD" \
            git -C .gla-tmp/glr fetch --depth 1 origin "$GLA_GLR_REF"
          LC_ALL=C GIT_ASKPASS="$GLR_ASKPASS" GIT_TERMINAL_PROMPT=0 \
            GLR_GIT_USERNAME="$GLR_GIT_USERNAME" GLR_GIT_PASSWORD="$GLR_GIT_PASSWORD" \
            git -C .gla-tmp/glr checkout --detach FETCH_HEAD
          ;;
        archive)
          set +x
          if [[ -n "${GITLAB_TOKEN:-}" ]]; then
            GLR_AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_TOKEN}"
          elif [[ -n "${CI_JOB_TOKEN:-}" ]]; then
            GLR_AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
          else
            echo "ERROR: GLA_GLR_FETCH_METHOD=archive requires GITLAB_TOKEN or CI_JOB_TOKEN" >&2
            exit 1
          fi
          GLR_URL="${CI_API_V4_URL}/projects/${GLA_GLR_PROJECT_ID}/repository/archive.tar.gz?sha=${GLA_GLR_REF}"
          HTTP_CODE=$(curl -sS -w '%{http_code}' --header "$GLR_AUTH_HEADER" \
            "$GLR_URL" -o .gla-tmp/glr.tar.gz) || true
          HTTP_CODE="${HTTP_CODE:-000}"
          [[ "$HTTP_CODE" =~ ^[0-9]+$ ]] || HTTP_CODE=000
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "ERROR: Failed to fetch glr archive (HTTP $HTTP_CODE)" >&2
            echo "  URL: $GLR_URL" >&2
            echo "  Check GLA_GLR_PROJECT_ID ($GLA_GLR_PROJECT_ID) and GLA_GLR_REF ($GLA_GLR_REF)." >&2
            exit 1
          fi
          if [[ ! -s .gla-tmp/glr.tar.gz ]]; then
            echo "ERROR: Fetched glr archive is empty" >&2; exit 1
          fi
          mkdir -p .gla-tmp/glr
          tar xzf .gla-tmp/glr.tar.gz -C .gla-tmp/glr --strip-components=1
          ;;
        *)
          echo "ERROR: GLA_GLR_FETCH_METHOD must be git or archive" >&2
          exit 1
          ;;
      esac
      # Use pak::local_install to resolve glr's declared Imports (e.g. digest)
      # rather than install.packages(repos=NULL) which skips dependencies.
      Rscript -e '
        if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak")
        pak::local_install(".gla-tmp/glr", upgrade = FALSE)
      '
      rm -rf .gla-tmp
      fi
    # Fetch and run the lint + Code Quality script from gla
    - |
      set -euo pipefail
      set +x
      LINT_SCRIPT_URL="${CI_API_V4_URL}/projects/${GLA_PROJECT_ID}/repository/files/scripts%2Flint-codequality.R/raw?ref=${GLA_REF}"
      if [[ -n "${GITLAB_TOKEN:-}" ]]; then
        GLA_AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      elif [[ -n "${CI_JOB_TOKEN:-}" ]]; then
        GLA_AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      else
        echo "ERROR: lint script retrieval requires GITLAB_TOKEN or CI_JOB_TOKEN" >&2
        exit 1
      fi
      HTTP_CODE=$(curl -sS -w '%{http_code}' --header "$GLA_AUTH_HEADER" \
        "$LINT_SCRIPT_URL" -o .gla-lint-codequality.R) || true
      HTTP_CODE="${HTTP_CODE:-000}"
      # Ensure HTTP_CODE is numeric (curl can emit unexpected output on failure)
      [[ "$HTTP_CODE" =~ ^[0-9]+$ ]] || HTTP_CODE=000
      if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
        echo "ERROR: Failed to fetch lint-codequality.R from gla (HTTP $HTTP_CODE)" >&2
        echo "  URL: $LINT_SCRIPT_URL" >&2
        echo "  Check GLA_PROJECT_ID and GLA_REF values." >&2
        exit 1
      fi
      # Validate fetched content: must be non-empty and look like an R script
      # (guards against empty responses, proxy HTML pages, or JSON error bodies)
      if [[ ! -s .gla-lint-codequality.R ]]; then
        echo "ERROR: Fetched lint-codequality.R is empty" >&2; exit 1
      fi
      # Strip UTF-8 BOM if present (Rscript cannot parse a leading BOM).
      # Done before the shebang check so we can use a plain ASCII grep pattern
      # (avoids grep hex-escape portability issues across GNU/BSD builds).
      # NOTE: \xEF\xBB\xBF escapes require GNU sed (standard on Linux CI runners).
      sed -i '1s/^\xEF\xBB\xBF//' .gla-lint-codequality.R
      # Anchored shebang check on the already-cleaned file: require #! followed
      # by Rscript. Rejects HTML error pages or JSON bodies that happen to
      # contain "Rscript" elsewhere on line 1.
      # NOTE: Does not catch HTTP-200 error pages that lack "Rscript" entirely
      # — those are caught by the non-empty check above + runtime parse errors.
      if ! head -1 .gla-lint-codequality.R | grep -qE '^#!.*Rscript'; then
        echo "ERROR: Fetched file does not look like an R script (shebang missing or malformed)" >&2
        echo "First line: $(head -1 .gla-lint-codequality.R)" >&2; exit 1
      fi
      Rscript .gla-lint-codequality.R
  cache:
    - key: cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - cache-$CI_DEFAULT_BRANCH
        - cache-default
      paths:
        - ${GLA_R_LIBS_USER}
  artifacts:
    when: always
    reports:
      codequality:
        - lintr_results.json

linting:
  extends: .gla-linting
