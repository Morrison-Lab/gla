# Runs the bats and Python test suites on GitHub, where pull requests are
# reviewed and merged. `.gitlab-ci.yml` runs the same two suites on GitLab
# (`bats-tests` and `test-check-new-line-breaks`); keep the commands in step.
name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Some tests read history, as the GitLab job's GIT_DEPTH: 0 does.
          fetch-depth: 0
          persist-credentials: false

      - name: Install bats
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats
          # The tests shell out to these, and a missing one fails with exit
          # 127, which reads as a broken test.
          for tool in bats jq git ruby; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::$tool is not installed"
              exit 1
            }
          done
          ruby -ryaml -e 'exit 0'

      - name: Configure git for the tests that build throwaway repositories
        run: |
          git config --global user.email "ci@gla.invalid"
          git config --global user.name "gla CI"
          git config --global init.defaultBranch main

      - name: Run the bats suite
        run: bats --print-output-on-failure tests/lib/

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run the Python unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
